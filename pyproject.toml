[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gs-frames"
version = "0.4.0"
description = "Extract sharp, overlap-aware stills from video for 3D Gaussian Splatting and COLMAP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.26",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
gs-frames = "gs_frames.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/gs_frames"]

[tool.mypy]
python_version = "3.12"
packages = ["gs_frames"]
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true
